name: proxy
on:
  repository_dispatch:
    types: [fetch]
  workflow_dispatch:
    inputs:
      url:
        description: u
        required: false
        type: string
      mode:
        description: m
        required: false
        type: string
      query:
        description: q
        required: false
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      URL: ${{ inputs.url || github.event.client_payload.url || 'UCYxwJRiWbMysWyezLBTlY_g' }}
      MODE: ${{ inputs.mode || github.event.client_payload.mode || 'innertube' }}
      QUERY: ${{ inputs.query || github.event.client_payload.query }}
    steps:
      - name: fetch
        shell: bash
        run: |
          echo "" | base64 -d > /tmp/fetch.py
          python3 /tmp/fetch.py
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: |
            /tmp/pages/out.md
            /tmp/pages/raw_*
          retention-days: 1

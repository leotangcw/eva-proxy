name: proxy
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to fetch'
        required: true
        type: string
      mode:
        description: 'get, search, or content'
        required: false
        default: 'get'
        type: string
      query:
        description: 'search query or content keyword'
        required: false
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch remote URL or search
        shell: bash
        run: |
          set +e
          URL="${{ inputs.url }}"
          MODE="${{ inputs.mode }}"
          QUERY="${{ inputs.query }}"
          OUT=/tmp/out.md
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          if [ "$MODE" = "search" ]; then
            ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$QUERY")
            curl -sL --max-time 25 "https://www.bing.com/search?q=$ENC&count=15" -H "User-Agent: $UA" -H "Accept-Language: en-US,en;q=0.9" -c /tmp/ck.txt -o /tmp/bing.html
            curl -sL --max-time 25 "https://duckduckgo.com/html/?q=$ENC" -H "User-Agent: $UA" -o /tmp/ddg.html
            echo '=== BING ===' > $OUT
            grep -oE '<h2><a[^>]*href="[^"]*"[^>]*>.*?</a></h2>' /tmp/bing.html | python3 -c "
import sys, re, html, base64, urllib.parse
for line in sys.stdin:
    m = re.search(r'href=\"([^\"]*)\"[^>]*>(.*?)</a>', line)
    if not m: continue
    href, text = m.group(1), html.unescape(re.sub('<[^>]+>','',m.group(2)))
    if 'bing.com/ck' in href:
        u = re.search(r'u=a1([^&\"]+)', href)
        if u:
            s = u.group(1)
            s += '=' * (-len(s) % 4)
            try: href = base64.b64decode(s).decode('utf-8','replace')
            except: pass
    print(f'- [{text}]({href})')
" >> $OUT
            echo '=== DDG ===' >> $OUT
            grep -oE 'class="result__a"[^>]*href="[^"]*"[^>]*>[^<]*' /tmp/ddg.html | head -20 >> $OUT
          else
            curl -sL --max-time 30 "$URL" -H "User-Agent: $UA" -H "Accept-Language: en-US,en;q=0.9" -o /tmp/page.html -w "HTTP %{http_code} final %{url_effective} bytes %{size_download}\n" > /tmp/status.txt
            cat /tmp/status.txt
            # content extraction to markdown-ish
            python3 - <<'PYEOF' >> $OUT
import re, html, os
raw = open('/tmp/page.html', encoding='utf-8', errors='replace').read()
query = os.environ.get('QUERY', '')
m = re.search(r'<title[^>]*>(.*?)</title>', raw, re.S|re.I)
print('TITLE:', html.unescape(m.group(1)).strip() if m else '(none)')
print('SIZE:', len(raw))
if query:
    print('--- CONTEXT FOR:', query)
    for mm in re.finditer(re.escape(query), raw, re.I):
        s = max(0, mm.start()-300); e = min(len(raw), mm.end()+300)
        snippet = raw[s:e].replace('\n',' ')
        snippet = html.unescape(re.sub(r'<[^>]+>', ' ', snippet))
        snippet = re.sub(r'\s+', ' ', snippet).strip()
        print('>>>', snippet[:700])
        print()
else:
    # strip scripts/styles, convert to text
    body = re.sub(r'<script.*?</script>', ' ', raw, flags=re.S|re.I)
    body = re.sub(r'<style.*?</style>', ' ', body, flags=re.S|re.I)
    body = re.sub(r'<br[^>]*>|</p>|</div>|</h[1-6]>|</li>', '\n', body, flags=re.I)
    text = re.sub(r'<[^>]+>', ' ', body)
    text = html.unescape(text)
    text = re.sub(r'[ \t]+', ' ', text)
    text = re.sub(r'\n\s*\n+', '\n', text)
    print('--- TEXT (first 8000 chars) ---')
    print(text[:8000])
PYEOF
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: /tmp/out.md
          retention-days: 1
